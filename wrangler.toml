name = "vulplink"
main = "worker/index.ts"
compatibility_date = "2026-09-10"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Let the Worker inject the public Supabase config into every HTML page.
# The Worker still forwards normal assets to ASSETS.fetch().
run_worker_first = [ "/contact/submit", "/*" ]

[vars]
SUPABASE_URL = "https://tzlzyhogpcjfkjekjzjp.supabase.co"
SUPABASE_EMAIL_FUNCTION = "send-contact-email"
# Public browser key. Add the value in Cloudflare Worker Settings > Variables
# (or leave this line out and add it there); never use SUPABASE_SERVICE_ROLE_KEY.
# SUPABASE_ANON_KEY = "your Supabase publishable/anon key"
